        <span class="subtitle" id="pageSubtitle">Visualize cells on the map</span>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" onclick="loadCells(false)" title="Refresh data">

        </button>
        <button class="icon-btn" id="toggleSidebarBtn" onclick="toggleMapSidebar()" title="Toggle filters panel">

            <span id="userBadge"></span>

          </button>
          <div class="menu" id="userMenu" onclick="event.stopPropagation()">
            <button id="darkModeBtn" onclick="toggleDarkMode()">

            </button>
            <hr>

        </div>

<!-- ═══════════════════════════════════════════════════════
     SERVICE WORKER
     ═══════════════════════════════════════════════════════ -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    console.log('✅ SW registered');

    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          console.log('🔄 New version available — updating...');
          newWorker.postMessage('SKIP_WAITING');
          setTimeout(() => window.location.reload(), 500);
        }
      });
    });
  }).catch(err => console.log('❌ SW failed:', err));

  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });
}
</script>
